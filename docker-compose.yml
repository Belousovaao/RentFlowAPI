services:
  postgres:
    image: postgres:16
    container_name: rentflow-postgres
    restart: always
    environment:
      POSTGRES_DB: rentflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rentflow-network

  minio:
    image: minio/minio:latest
    container_name: rentflow-minio
    restart: always
    environment:
      MINIO_ROOT_USER: volnamiDrive
      MINIO_ROOT_PASSWORD: volnamiDrive2026
      MINIO_REGION: us-east-1
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - rentflow-network

  api:
    build:
      context: ./backend
      dockerfile: RentFlow.Api/Dockerfile
    container_name: rentflow-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__Db=Host=postgres;Port=5432;Database=rentflow;Username=postgres;Password=postgres
      - GarageOptions__Endpoint=http://minio:9000
      - GarageOptions__Bucket=rentflow-photos
      - GarageOptions__PublicBaseUrl=http://localhost:9000/rentflow-photos
      - GarageOptions__AccessKey=volnamiDrive
      - GarageOptions__SecretKey=volnamiDrive
      - Jwt__Key=volnamidrivevolnamidrivevolnamidrive
      - Jwt__Issuer=volnamidrive
      - Jwt__Audience=volnamiDriveClient
    networks:
      - rentflow-network
    volumes:
      - ./backend:/src

networks:
  rentflow-network:
    driver: bridge

volumes:
  postgres_data:
  minio_data: